<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Manager | KEHEM IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#818cf8',
                        accent: '#4f46e5',
                        dark: '#1e293b',
                        light: '#f1f5f9'
                    }
                }
            }
        }
    </script>
    <style>
        .note-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .note-card:hover {
            transform: translateY(-2px);
            background-color: rgba(241, 245, 249, 0.7);
        }

        .note-card.active {
            background-color: rgba(99, 102, 241, 0.1);
            border-left-color: #6366f1;
        }

        .ql-container {
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .ql-toolbar {
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }

        .empty-state {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-lg bg-indigo-500 flex items-center justify-center">
                    <i class="fas fa-sticky-note text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-indigo-900">Note Manager</h1>
            </div>
            <button id="newNoteBtn"
                class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition"
                aria-label="Create new note">
                <i class="fas fa-plus"></i>
                <span>New Note</span>
            </button>
        </div>
    </header>

    <div class="container mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6">
        <!-- Sidebar -->
        <aside class="lg:w-1/4 w-full">
            <div class="bg-white rounded-xl shadow p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-800">All Notes</h2>
                    <div class="relative">
                        <input type="text" id="searchNotes" placeholder="Search notes..."
                            class="w-full py-2 px-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500"
                            aria-label="Search notes">
                        <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                    </div>
                </div>

                <div id="notesList"
                    class="max-h-[calc(100vh-180px)] overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-indigo-200 scrollbar-rounded">
                    <div id="notesLoading" class="py-12 flex flex-col items-center justify-center">
                        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-500"></div>
                        <p class="mt-4 text-gray-500">Loading notes...</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="lg:w-3/4 w-full flex flex-col">
            <div id="editorArea" class="flex-1 bg-white rounded-xl shadow flex flex-col">
                <!-- Empty State -->
                <div id="emptyState" class="py-16 flex flex-col items-center justify-center empty-state">
                    <div class="bg-indigo-100 rounded-full p-4 mb-4">
                        <i class="fas fa-sticky-note text-indigo-500 text-4xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">No Note Selected</h3>
                    <p class="text-gray-500 max-w-md text-center mb-6">Select a note from the sidebar to view or edit,
                        or create a new note to get started.</p>
                    <button id="firstNoteBtn"
                        class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2 rounded-lg flex items-center space-x-2 transition"
                        aria-label="Create first note">
                        <i class="fas fa-plus"></i>
                        <span>Create First Note</span>
                    </button>
                </div>

                <!-- Editor State -->
                <div id="editorState" class="hidden h-full flex flex-col">
                    <div class="p-4 border-b">
                        <div class="flex items-center justify-between">
                            <input id="noteTitle" type="text" placeholder="Untitled Note"
                                class="text-2xl font-bold text-indigo-900 w-full py-2 px-0 border-0 focus:outline-none focus:ring-0 focus:border-b focus:border-indigo-300"
                                aria-label="Note title">
                            <div class="flex space-x-2">
                                <button id="saveNoteBtn"
                                    class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center space-x-1 transition"
                                    aria-label="Save note">
                                    <i class="fas fa-save"></i>
                                    <span>Save</span>
                                </button>
                                <button id="deleteNoteBtn"
                                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg flex items-center space-x-1 transition"
                                    aria-label="Delete note">
                                    <i class="fas fa-trash"></i>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </div>
                        <div class="mt-2 flex items-center text-sm text-gray-500">
                            <i class="fas fa-clock mr-2"></i>
                            <span id="updatedAt">Last updated: Just now</span>
                        </div>
                    </div>

                    <!-- Rich Text Editor -->
                    <div class="flex-1 flex flex-col">
                        <div id="editor" class="flex-1"></div>
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div id="statusBar"
                class="mt-4 bg-white rounded-lg shadow-sm p-3 flex items-center justify-between text-sm text-gray-500 hidden">
                <div>
                    <i class="fas fa-info-circle mr-2"></i>
                    <span id="statusMessage">Note saved successfully</span>
                </div>
                <div>
                    <span id="characterCount">0 characters</span>
                    <span class="mx-2">•</span>
                    <span id="wordCount">0 words</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Global variables
        let quill = null;
        let notes = [];
        let currentNoteId = null;

        // DOM Elements
        const notesList = document.getElementById('notesList');
        const editorArea = document.getElementById('editorArea');
        const emptyState = document.getElementById('emptyState');
        const editorState = document.getElementById('editorState');
        const statusBar = document.getElementById('statusBar');
        const statusMessage = document.getElementById('statusMessage');
        const saveNoteBtn = document.getElementById('saveNoteBtn');
        const deleteNoteBtn = document.getElementById('deleteNoteBtn');
        const newNoteBtn = document.getElementById('newNoteBtn');
        const firstNoteBtn = document.getElementById('firstNoteBtn');
        const noteTitle = document.getElementById('noteTitle');
        const updatedAt = document.getElementById('updatedAt');
        const searchNotes = document.getElementById('searchNotes');

        // Initialize Quill editor
        function initEditor() {
            quill = new Quill('#editor', {
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                        ['link'],
                        ['clean']
                    ]
                },
                placeholder: 'Write your note here...',
                theme: 'snow'
            });

            // Update character count on text change
            quill.on('text-change', () => {
                const text = quill.getText();
                const charCount = text.length;
                const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                document.getElementById('characterCount').textContent = `${charCount} characters`;
                document.getElementById('wordCount').textContent = `${wordCount} words`;
            });
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            initEditor();
            fetchNotes();

            // Event Listeners
            newNoteBtn.addEventListener('click', createNewNote);
            firstNoteBtn.addEventListener('click', createNewNote);
            saveNoteBtn.addEventListener('click', saveCurrentNote);
            deleteNoteBtn.addEventListener('click', deleteCurrentNote);
            noteTitle.addEventListener('keyup', handleTitleChange);
            searchNotes.addEventListener('input', searchNotesHandler);

            // Auto-save throttled
            if (quill) {
                quill.on('text-change', throttle(autoSave, 2000));
            }
        });

        // Throttle function for auto-saving
        function throttle(func, limit) {
            let lastFunc;
            let lastRan;
            return function () {
                const context = this;
                const args = arguments;
                if (!lastRan) {
                    func.apply(context, args);
                    lastRan = Date.now();
                } else {
                    clearTimeout(lastFunc);
                    lastFunc = setTimeout(function () {
                        if ((Date.now() - lastRan) >= limit) {
                            func.apply(context, args);
                            lastRan = Date.now();
                        }
                    }, limit - (Date.now() - lastRan));
                }
            }
        }

        // Auto-save function
        {% comment %} function autoSave() {
            if (currentNoteId !== null && currentNoteId !== undefined) {
                saveNote(true); // true for auto-save
            }
        } {% endcomment %}

        // Fetch notes from API
        async function fetchNotes(attempts = 3) {
            setLoading(true);
            try {
                const response = await fetch('https://kehem.com/api/kehem_note_list');
                if (!response.ok) throw new Error('Failed to fetch notes');
                notes = await response.json();
                renderNotes(notes);
                setLoading(false);
            } catch (error) {
                if (attempts > 1) {
                    setTimeout(() => fetchNotes(attempts - 1), 3000);
                } else {
                    showStatus('Failed to load notes after multiple attempts', true);
                    setLoading(false);
                }
            }
        }

        // Set loading state
        function setLoading(isLoading) {
            const loadingDiv = document.getElementById('notesLoading');
            if (isLoading && !loadingDiv) {
                notesList.innerHTML = `
          <div id="notesLoading" class="py-12 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-500"></div>
            <p class="mt-4 text-gray-500">Loading notes...</p>
          </div>
        `;
            } else if (!isLoading && loadingDiv) {
                loadingDiv.remove();
            }
        }

        // Render notes to the sidebar
        function renderNotes(notesToRender) {
            notesList.innerHTML = '';

            if (notesToRender.length === 0) {
                notesList.innerHTML = `
          <div class="py-8 text-center text-gray-500">
            <i class="fas fa-inbox text-3xl mb-2"></i>
            <p>No notes found</p>
          </div>
        `;
                return;
            }

            notesToRender.forEach(note => {
                const date = new Date(note.updated_at);
                const formattedDate = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
                });

                const noteElement = document.createElement('div');
                noteElement.className = 'note-card p-3 mb-2 rounded-lg cursor-pointer transition bg-white';
                noteElement.dataset.id = note.id;
                noteElement.innerHTML = `
          <div class="flex justify-between items-start">
            <h3 class="font-semibold truncate max-w-[75%]">${note.title || 'Untitled Note'}</h3>
            <button class="delete-note-btn opacity-0 hover:opacity-100 transition p-1 rounded-full hover:bg-red-100 text-red-500 text-sm" aria-label="Delete note">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="flex justify-between items-center mt-1">
            <p class="text-xs text-gray-500">${formattedDate}</p>
            <span class="text-xs px-2 py-1 rounded-full bg-indigo-100 text-indigo-800">${note.content.length > 100 ? '📝' : '📄'}</span>
          </div>
        `;

                noteElement.addEventListener('click', () => selectNote(note.id));
                notesList.appendChild(noteElement);
            });

            // Add delete button listeners
            document.querySelectorAll('.delete-note-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentNoteId = parseInt(e.target.closest('.note-card').dataset.id);
                    deleteCurrentNote();
                });
            });
        }

        // Search notes handler
        function searchNotesHandler() {
            const term = searchNotes.value.toLowerCase();
            if (term) {
                const filtered = notes.filter(note =>
                    note.title.toLowerCase().includes(term) ||
                    note.content.toLowerCase().includes(term)
                );
                renderNotes(filtered);
            } else {
                renderNotes(notes);
            }
        }

        // Create a new note
        function createNewNote() {
            emptyState.classList.add('hidden');
            editorState.classList.remove('hidden');

            currentNoteId = null;
            noteTitle.value = 'Untitled Note';
            updatedAt.textContent = 'Last updated: Just now';

            if (quill) {
                quill.setText('');
            }

            setTimeout(() => {
                noteTitle.focus();
                noteTitle.select();
                noteTitle.setAttribute('aria-selected', 'true');
            }, 100);
        }

        // Select a note to view/edit
        function selectNote(id) {
            currentNoteId = id;
            const note = notes.find(note => note.id === id);

            if (!note) return;

            emptyState.classList.add('hidden');
            editorState.classList.remove('hidden');

            noteTitle.value = note.title || 'Untitled Note';
            updatedAt.textContent = `Last updated: ${formatDate(note.updated_at)}`;

            if (quill) {
                quill.root.innerHTML = note.content || '';
            }

            document.querySelectorAll('.note-card').forEach(card => {
                card.classList.toggle('active', parseInt(card.dataset.id) === id);
            });
        }

        // Format date for display
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();

            const timeDiff = now - date;
            const minuteDiff = Math.floor(timeDiff / (1000 * 60));
            const hourDiff = Math.floor(timeDiff / (1000 * 60 * 60));
            const dayDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

            if (minuteDiff < 1) return 'Just now';
            if (minuteDiff < 60) return `${minuteDiff} minutes ago`;
            if (hourDiff < 24) return `${hourDiff} hours ago`;
            if (dayDiff === 1) return 'Yesterday';
            if (dayDiff < 7) return `${dayDiff} days ago`;

            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        // Save current note
        function saveCurrentNote() {
            saveNote(false);
        }

        // Handle note title changes
        function handleTitleChange() {
            if (noteTitle.value.trim() === '') {
                noteTitle.value = 'Untitled Note';
            }

            if (currentNoteId !== null) {
                autoSave();
            }
        }

        // Save note to API
        async function saveNote(isAutoSave = false) {
            if (!noteTitle || !quill) return;

            const title = noteTitle.value || 'Untitled Note';
            const content = quill.root.innerHTML;

            try {
                let response;

                if (currentNoteId === null || currentNoteId === undefined) {
                    response = await fetch('https://kehem.com/api/kehem_note_create', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ title, content })
                    });

                    if (!response.ok) throw new Error('Failed to create note');

                    const newNote = await response.json();
                    currentNoteId = newNote.id;

                    notes.push(newNote);
                    renderNotes(notes);
                    selectNote(newNote.id);

                    showStatus('Note created successfully');
                } else {
                    response = await fetch(`https://kehem.com/api/kehem_note_update/${currentNoteId}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ title, content })
                    });

                    if (!response.ok) throw new Error('Failed to update note');

                    const updatedNote = await response.json();

                    const index = notes.findIndex(note => note.id === currentNoteId);
                    if (index !== -1) {
                        notes[index] = updatedNote;
                        renderNotes(notes);
                        updatedAt.textContent = `Last updated: ${formatDate(new Date().toISOString())}`;
                    }

                    if (!isAutoSave) {
                        showStatus('Note saved successfully');
                    }
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, true);
            }
        }

        // Delete current note
        async function deleteCurrentNote() {
            if (currentNoteId === null || currentNoteId === undefined) return;

            if (!confirm('Are you sure you want to delete this note? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`https://kehem.com/api/kehem_note_update/${currentNoteId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete note');

                notes = notes.filter(note => note.id !== currentNoteId);
                renderNotes(notes);

                editorState.classList.add('hidden');
                emptyState.classList.remove('hidden');
                currentNoteId = null;

                showStatus('Note deleted successfully');
            } catch (error) {
                showStatus(`Error: ${error.message}`, true);
            }
        }

        // Show status message
        function showStatus(message, isError = false) {
            statusBar.classList.remove('hidden', 'bg-green-50', 'bg-red-50');
            statusBar.classList.add(isError ? 'bg-red-50' : 'bg-green-50');
            statusMessage.textContent = message;

            
        }
    </script>
</body>

</html>
